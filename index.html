<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>성모 게이밍 허브</title>
  <!-- 홈 화면 앱(PWA) 설정 -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#0b0620">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0620;
      --bg-2: #150c35;
      --panel: rgba(255, 255, 255, 0.06);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #f4f1ff;
      --muted: #a79fd0;
      --neon-pink: #ff3ea5;
      --neon-cyan: #22e4ff;
      --neon-yellow: #ffe14d;
      --neon-green: #3dffa2;
      --neon-purple: #9b5cff;
      --radius: 22px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      font-family: 'Jua', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(155, 92, 255, 0.35), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, rgba(255, 62, 165, 0.25), transparent 60%),
        radial-gradient(800px 600px at 50% 120%, rgba(34, 228, 255, 0.18), transparent 60%),
        var(--bg);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    /* 배경 별 */
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .stars span {
      position: absolute; width: 3px; height: 3px; border-radius: 50%;
      background: #fff; opacity: .6; animation: twinkle 3s infinite ease-in-out;
    }
    @keyframes twinkle { 50% { opacity: .1; transform: scale(.6); } }

    .app {
      position: relative; z-index: 1;
      max-width: 1280px; margin: 0 auto;
      padding: 24px clamp(16px, 3vw, 40px) 120px;
    }

    /* ===== 헤더 ===== */
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      margin-bottom: 24px;
    }
    .logo { display: flex; align-items: center; gap: 14px; }
    .logo-icon {
      width: 60px; height: 60px; border-radius: 18px;
      display: grid; place-items: center; font-size: 32px;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      box-shadow: 0 0 24px rgba(255, 62, 165, .6);
      animation: bob 3s ease-in-out infinite;
    }
    @keyframes bob { 50% { transform: translateY(-4px) rotate(-4deg); } }
    .logo-text small {
      display: block; font-family: 'Press Start 2P', monospace; font-size: 10px;
      color: var(--neon-cyan); letter-spacing: 2px; margin-bottom: 6px;
      text-shadow: 0 0 8px var(--neon-cyan);
    }
    .logo-text h1 {
      margin: 0; font-family: 'Black Han Sans', sans-serif; font-weight: 400;
      font-size: clamp(26px, 3.4vw, 38px); line-height: 1;
      background: linear-gradient(90deg, #fff, var(--neon-yellow));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .player {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 16px 8px 8px; border-radius: 999px;
      background: var(--panel); border: 1px solid var(--panel-border);
      backdrop-filter: blur(10px);
    }
    .avatar {
      width: 46px; height: 46px; border-radius: 50%; font-size: 26px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--neon-yellow), #ff9a3d);
    }
    .player-info b { display: block; font-size: 17px; }
    .player-info span { font-size: 13px; color: var(--muted); }
    .fs-btn {
      flex: none; width: 56px; height: 56px; border-radius: 16px; cursor: pointer;
      font-size: 26px; color: var(--text);
      background: var(--panel); border: 1px solid var(--panel-border);
    }
    .fs-btn:active { transform: scale(.94); }
    .fs-btn.on { background: var(--neon-cyan); color: #1a0b3a; border-color: var(--neon-cyan); }
    .player { margin-left: auto; }
    .coins {
      margin-left: 8px; padding: 6px 12px; border-radius: 999px;
      background: rgba(255, 225, 77, .15); color: var(--neon-yellow); font-size: 16px;
    }

    /* ===== 검색 ===== */
    .search {
      display: flex; align-items: center; gap: 12px;
      padding: 0 20px; height: 60px; border-radius: 18px;
      background: var(--panel); border: 1px solid var(--panel-border);
      margin-bottom: 24px;
    }
    .search input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font: inherit; font-size: 19px;
    }
    .search input::placeholder { color: var(--muted); }

    /* ===== 추천 배너 ===== */
    .hero {
      position: relative; overflow: hidden;
      display: grid; grid-template-columns: 1.2fr 1fr; align-items: center;
      min-height: 280px; border-radius: 28px; padding: 36px 40px;
      background: linear-gradient(120deg, #6a2cff 0%, #ff3ea5 70%, #ff8a3d 100%);
      box-shadow: 0 20px 60px rgba(155, 92, 255, .35);
      margin-bottom: 36px;
    }
    .hero::after {
      content: ''; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.07) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255,255,255,.07) 2px, transparent 2px);
      background-size: 40px 40px; pointer-events: none;
    }
    .hero-content { position: relative; z-index: 1; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 999px; font-size: 14px;
      background: rgba(0, 0, 0, .25); margin-bottom: 14px;
    }
    .hero h2 {
      margin: 0 0 10px; font-family: 'Black Han Sans', sans-serif; font-weight: 400;
      font-size: clamp(34px, 5vw, 56px); line-height: 1.05;
      text-shadow: 0 4px 0 rgba(0,0,0,.2);
    }
    .hero p { margin: 0 0 24px; font-size: 18px; opacity: .92; }
    .btn-play {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 16px 34px; border: none; border-radius: 999px; cursor: pointer;
      font: inherit; font-size: 22px; color: #2a0c55;
      background: var(--neon-yellow);
      box-shadow: 0 6px 0 #c9a800, 0 10px 30px rgba(255, 225, 77, .5);
      transition: transform .1s, box-shadow .1s;
    }
    .btn-play:active { transform: translateY(5px); box-shadow: 0 1px 0 #c9a800; }
    .hero-art {
      position: relative; z-index: 1; height: 100%;
      display: grid; place-items: center;
    }

    .hero-emoji { font-size: 150px; line-height: 1; filter: drop-shadow(0 12px 20px rgba(0,0,0,.35)); animation: float 3s ease-in-out infinite; }
    @media (max-width: 820px) { .hero-emoji { font-size: 110px; } }

    /* 미니 테트리스 아트 */
    .tetris-art {
      display: grid; grid-template-columns: repeat(6, 36px); grid-auto-rows: 36px; gap: 4px;
      transform: rotate(-8deg);
      filter: drop-shadow(0 12px 20px rgba(0,0,0,.35));
    }
    .tetris-art i {
      border-radius: 7px;
      box-shadow: inset 0 -5px 0 rgba(0,0,0,.2), inset 0 4px 0 rgba(255,255,255,.35);
    }
    .tetris-art i.e { box-shadow: none; }
    .tetris-art .falling { animation: fall 2.4s ease-in-out infinite; }
    @keyframes fall { 0%, 20% { transform: translateY(-40px); opacity: 0; } 60%,100% { transform: translateY(0); opacity: 1; } }

    /* ===== 섹션 공통 ===== */
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      margin: 0 0 16px;
    }
    .section-head h3 {
      margin: 0; font-family: 'Black Han Sans', sans-serif; font-weight: 400;
      font-size: 28px; display: flex; align-items: center; gap: 10px;
    }
    .section-head .count { color: var(--muted); font-size: 16px; }

    /* 카테고리 탭 */
    .tabs {
      display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px;
      margin-bottom: 22px; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: none; padding: 12px 22px; border-radius: 999px; cursor: pointer;
      font: inherit; font-size: 18px; color: var(--muted);
      background: var(--panel); border: 1px solid var(--panel-border);
      transition: all .2s;
    }
    .tab.active {
      color: #1a0b3a; background: var(--neon-cyan); border-color: var(--neon-cyan);
      box-shadow: 0 0 20px rgba(34, 228, 255, .5);
    }

    /* 최근 플레이 */
    .recent {
      display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px;
      margin-bottom: 36px; scrollbar-width: none;
    }
    .recent::-webkit-scrollbar { display: none; }
    .recent-item {
      flex: none; display: flex; align-items: center; gap: 12px;
      padding: 10px 20px 10px 10px; border-radius: 18px; cursor: pointer;
      background: var(--panel); border: 1px solid var(--panel-border);
    }
    .recent-item .mini {
      width: 50px; height: 50px; border-radius: 14px;
      display: grid; place-items: center; font-size: 28px;
    }
    .recent-item b { display: block; font-size: 17px; }
    .recent-item span { font-size: 13px; color: var(--muted); }
    .empty-recent { color: var(--muted); font-size: 16px; padding: 14px 4px; }

    /* ===== 게임 카드 그리드 ===== */
    .grid {
      display: grid; gap: 22px;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    }
    .card {
      position: relative; border-radius: var(--radius); overflow: hidden; cursor: pointer;
      background: var(--bg-2); border: 1px solid var(--panel-border);
      transition: transform .18s, box-shadow .18s;
      animation: pop .4s backwards;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.97); } }
    .card:active { transform: scale(.96); }
    @media (hover: hover) {
      .card:hover { transform: translateY(-6px); box-shadow: 0 16px 40px var(--glow); }
    }
    .thumb {
      position: relative; aspect-ratio: 4 / 3;
      display: grid; place-items: center; font-size: 84px;
      background: var(--grad);
    }
    .thumb::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 50%);
    }
    .thumb .emoji {
      position: relative; filter: drop-shadow(0 8px 12px rgba(0,0,0,.3));
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 50% { transform: translateY(-8px); } }
    .tag {
      position: absolute; top: 12px; left: 12px; z-index: 1;
      padding: 4px 12px; border-radius: 999px; font-size: 13px;
      background: rgba(0,0,0,.35); backdrop-filter: blur(6px);
    }
    .tag.new { background: var(--neon-green); color: #073b22; }
    .tag.hot { background: var(--neon-pink); }
    .fav {
      position: absolute; top: 10px; right: 10px; z-index: 2;
      width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
      font-size: 22px; background: rgba(0,0,0,.3); color: #fff;
      display: grid; place-items: center;
    }
    .fav.on { background: #fff; color: var(--neon-pink); }
    .card-body { padding: 16px 18px 18px; }
    .card-body h4 { margin: 0 0 6px; font-size: 22px; font-weight: 400; }
    .card-body p {
      margin: 0 0 14px; font-size: 15px; color: var(--muted); line-height: 1.4;
      min-height: 42px;
    }
    .card-foot { display: flex; align-items: center; justify-content: space-between; }
    .cat-label { color: var(--muted); font-size: 15px; }
    .play-mini {
      width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
      font-size: 20px; color: #1a0b3a; background: var(--accent);
      box-shadow: 0 0 16px var(--glow);
    }

    /* 준비중 카드 */
    .card.soon { cursor: default; opacity: .7; }
    .card.soon .thumb { background: repeating-linear-gradient(45deg, #1d1448, #1d1448 16px, #241a57 16px, #241a57 32px); }
    .card.soon .play-mini { background: #3a2f6e; color: var(--muted); box-shadow: none; }

    .no-result { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 0; font-size: 18px; }

    /* ===== 하단 네비게이션 ===== */
    .bottom-nav {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10;
      display: flex; gap: 6px; padding: 8px;
      border-radius: 999px; background: rgba(20, 12, 50, .85);
      border: 1px solid var(--panel-border); backdrop-filter: blur(14px);
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }
    .nav-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 22px; border-radius: 999px; border: none; cursor: pointer;
      font: inherit; font-size: 17px; color: var(--muted); background: none;
    }
    .nav-btn.active { background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple)); color: #fff; }
    .nav-btn .ico { font-size: 22px; }

    /* ===== 로딩 모달 ===== */
    .launch {
      position: fixed; inset: 0; z-index: 50;
      display: none; place-items: center;
      background: rgba(8, 4, 24, .88); backdrop-filter: blur(8px);
    }
    .launch.show { display: grid; animation: fadeIn .2s; }
    @keyframes fadeIn { from { opacity: 0; } }
    .launch-box { text-align: center; }
    .launch-emoji { font-size: 110px; animation: spin 1.2s ease-in-out infinite; }
    @keyframes spin { 50% { transform: scale(1.15) rotate(10deg); } }
    .launch h2 { font-family: 'Black Han Sans', sans-serif; font-weight: 400; font-size: 40px; margin: 16px 0 8px; }
    .launch p { font-family: 'Press Start 2P', monospace; font-size: 14px; color: var(--neon-cyan); }
    .bar { width: 280px; height: 14px; border-radius: 99px; background: #241a57; margin: 20px auto 0; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink)); animation: load 1.2s forwards; }
    @keyframes load { to { width: 100%; } }

    /* ===== 게임 화면 (허브 안에서 전체화면으로 실행) ===== */
    .player-frame {
      position: fixed; inset: 0; z-index: 40; display: none; background: #000;
    }
    .player-frame.show { display: block; }
    .player-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
    .player-bar { position: fixed; top: 14px; left: 14px; z-index: 41; display: flex; gap: 8px; }
    .home-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 16px; border-radius: 999px; border: none; cursor: pointer;
      font: inherit; font-size: 16px; color: #fff;
      background: rgba(20, 12, 50, .7); backdrop-filter: blur(8px);
      border: 1px solid var(--panel-border); opacity: .75;
    }
    .home-btn:active { opacity: 1; transform: scale(.95); }
    /* 전체화면이 풀렸을 때 눈에 띄게 */
    .home-btn.attn {
      opacity: 1; color: #1a0b3a; background: var(--neon-cyan); border-color: var(--neon-cyan);
      animation: attn 1.6s ease-in-out infinite;
    }
    @keyframes attn { 50% { box-shadow: 0 0 0 8px rgba(34, 228, 255, .25); } }
    /* 게임 중 전체화면이 풀리면 게임 위를 한 번 터치해서 되돌리는 막 */
    .fs-catcher {
      position: absolute; inset: 0; z-index: 2; display: none;
      align-items: flex-end; justify-content: center; padding-bottom: 48px;
      background: rgba(0, 0, 0, .25); cursor: pointer;
    }
    .fs-catcher.show { display: flex; }
    .fs-catcher span {
      padding: 14px 26px; border-radius: 999px; font-size: 19px;
      color: #1a0b3a; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.4);
      animation: float 2s ease-in-out infinite;
    }

    /* ===== 관리자 화면 ===== */
    .admin {
      position: fixed; inset: 0; z-index: 70; display: none;
      background: rgba(8, 4, 24, .85); backdrop-filter: blur(8px);
      padding: 20px; overflow-y: auto;
    }
    .admin.show { display: block; animation: fadeIn .2s; }
    .admin-box {
      max-width: 900px; margin: 0 auto; border-radius: 26px; overflow: hidden;
      background: var(--bg-2); border: 1px solid var(--panel-border);
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .admin-head {
      display: flex; align-items: center; gap: 12px; padding: 20px 24px;
      background: linear-gradient(120deg, #6a2cff, #ff3ea5);
    }
    .admin-head h2 { margin: 0; font-family: 'Black Han Sans', sans-serif; font-weight: 400; font-size: 28px; }
    .admin-head .who { flex: 1; font-size: 14px; opacity: .85; }
    .admin-list { padding: 18px; display: grid; gap: 14px; }
    .arow {
      padding: 16px; border-radius: 18px;
      background: var(--panel); border: 1px solid var(--panel-border);
      display: grid; gap: 10px;
    }
    .arow-top { display: flex; gap: 10px; align-items: center; }
    .admin input, .admin select {
      width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px;
      font: inherit; font-size: 17px; color: var(--text);
      background: rgba(0,0,0,.3); border: 1px solid var(--panel-border); outline: none;
    }
    .admin input:focus, .admin select:focus { border-color: var(--neon-cyan); }
    .admin input.bad { border-color: var(--neon-pink); background: rgba(255,62,165,.12); }
    .admin .a-emoji { width: 64px; flex: none; text-align: center; font-size: 26px; padding: 6px; }
    .admin .a-title { font-size: 20px; }
    .admin label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
    .admin .a-url { font-family: monospace; font-size: 14px; }
    .arow-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .colors { display: flex; gap: 6px; }
    .admin input[type=color] { padding: 4px; min-height: 48px; cursor: pointer; }
    .arow-btns { display: flex; gap: 6px; flex: none; }
    .abtn {
      min-width: 48px; height: 48px; padding: 0 16px; border-radius: 12px; cursor: pointer;
      font: inherit; font-size: 18px; color: var(--text);
      background: rgba(255,255,255,.08); border: 1px solid var(--panel-border);
    }
    .abtn:active { transform: scale(.95); }
    .abtn.danger { color: #ff8ab8; }
    .abtn.primary { background: var(--neon-yellow); color: #2a0c55; border: none; }
    .abtn.ghost { background: rgba(0,0,0,.25); border: none; color: #fff; }
    .abtn:disabled { opacity: .5; }
    .admin-foot {
      position: sticky; bottom: 0; display: flex; gap: 10px; align-items: center;
      padding: 16px 18px; background: var(--bg-2); border-top: 1px solid var(--panel-border);
    }
    .admin-foot .spacer { flex: 1; }
    @media (max-width: 700px) { .arow-grid { grid-template-columns: 1fr 1fr; } }

    .toast {
      position: fixed; left: 50%; bottom: 100px; z-index: 60;
      transform: translateX(-50%) translateY(20px); opacity: 0;
      padding: 12px 22px; border-radius: 999px; font-size: 16px;
      background: #fff; color: #1a0b3a; transition: all .25s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== 반응형 (태블릿 세로 / 폰) ===== */
    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; padding: 28px; text-align: center; }
      .hero-art { order: -1; margin-bottom: 16px; }
      .tetris-art { grid-template-columns: repeat(6, 26px); grid-auto-rows: 26px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    }
    @media (max-width: 560px) {
      .player-info, .coins { display: none; }
      .player { padding: 6px; }
      .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .thumb { font-size: 60px; }
      .card-body h4 { font-size: 18px; }
      .card-body p { display: none; }
      .nav-btn { padding: 12px 16px; }
      .nav-btn .label { display: none; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="app">
    <!-- 헤더 -->
    <header>
      <div class="logo">
        <div class="logo-icon">🎮</div>
        <div class="logo-text">
          <small>GAMING HUB</small>
          <h1>성모 게이밍 허브</h1>
        </div>
      </div>
      <div class="player">
        <div class="avatar">😎</div>
        <div class="player-info">
          <b id="greeting">안녕, 플레이어!</b>
          <span>오늘도 신나게 놀아볼까?</span>
        </div>
        <div class="coins">🪙 <span id="coinCount">0</span></div>
      </div>
      <button class="fs-btn" id="adminBtn" title="게임 관리" style="display:none">⚙️</button>
      <button class="fs-btn" id="fsBtn" data-fs title="전체화면">⛶</button>
    </header>

    <!-- 검색 -->
    <label class="search">
      <span style="font-size:22px">🔍</span>
      <input id="searchInput" type="text" placeholder="어떤 게임을 할까요?" autocomplete="off">
    </label>

    <!-- 추천 배너 -->
    <section class="hero" id="hero">
      <div class="hero-content">
        <div class="badge">⭐ 오늘의 추천 게임</div>
        <h2 id="heroTitle">테트리스</h2>
        <p id="heroDesc">떨어지는 블록을 쌓아서 줄을 없애 보세요!</p>
        <button class="btn-play" id="heroPlay">▶ 지금 플레이</button>
      </div>
      <div class="hero-art">
        <div class="tetris-art" id="tetrisArt"></div>
        <div class="hero-emoji" id="heroEmoji" style="display:none"></div>
      </div>
    </section>

    <!-- 최근 플레이 -->
    <div class="section-head"><h3>🕹️ 최근에 한 게임</h3></div>
    <div class="recent" id="recentList"></div>

    <!-- 게임 목록 -->
    <div class="section-head">
      <h3 id="listTitle">🎲 전체 게임</h3>
      <span class="count" id="gameCount"></span>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="gameGrid"></div>
  </div>

  <!-- 하단 네비 -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="home"><span class="ico">🏠</span><span class="label">홈</span></button>
    <button class="nav-btn" data-view="fav"><span class="ico">❤️</span><span class="label">즐겨찾기</span></button>
    <button class="nav-btn" data-view="new"><span class="ico">✨</span><span class="label">새 게임</span></button>
  </nav>

  <!-- 게임 실행 로딩 -->
  <div class="launch" id="launch">
    <div class="launch-box">
      <div class="launch-emoji" id="launchEmoji">🎮</div>
      <h2 id="launchTitle">게임</h2>
      <p>LOADING...</p>
      <div class="bar"><i></i></div>
    </div>
  </div>

  <!-- 게임 화면 -->
  <div class="player-frame" id="playerFrame">
    <div class="player-bar">
      <button class="home-btn" id="homeBtn">🏠 허브로</button>
      <button class="home-btn" id="fsBtn2" data-fs>⛶ 전체화면</button>
      <button class="home-btn" id="popBtn" title="화면이 안 나오면 눌러요">↗ 새 화면으로</button>
    </div>
    <div class="fs-catcher" id="fsCatcher"><span>👆 화면을 한 번 누르면 다시 전체화면이 돼요</span></div>
  </div>

  <!-- 관리자: 게임 링크 관리 -->
  <div class="admin" id="admin">
    <div class="admin-box">
      <div class="admin-head">
        <h2>⚙️ 게임 관리</h2>
        <span class="who" id="adminWho"></span>
        <button class="abtn ghost" id="adminClose">✕</button>
      </div>
      <div class="admin-list" id="adminList"></div>
      <div class="admin-foot">
        <button class="abtn" id="adminAdd">＋ 게임 추가</button>
        <span class="spacer"></span>
        <button class="abtn" id="adminCancel">취소</button>
        <button class="abtn primary" id="adminSave">💾 저장</button>
      </div>
    </div>
  </div>
  <datalist id="catList"></datalist>

  <div class="toast" id="toast"></div>

  <script>
    /* =========================================================
       기본 게임 목록 — 관리자가 허브에서 저장하기 전까지 사용됩니다.
       관리자 계정으로 접속하면 오른쪽 위 ⚙️ 버튼으로 링크를 넣고 저장할 수 있어요.
       url 이 비어 있으면 '준비 중' 으로 표시됩니다.
       openMode: 'hub' = 허브 안에서 열기, 'top' = 새 화면으로 이동
       ========================================================= */
    var DEFAULT_GAMES = [
      { id: 'tetris', title: '성모 테트리스', emoji: '🧱', category: '퍼즐',
        desc: '떨어지는 블록을 쌓아서 줄을 없애 보세요!',
        url: 'https://script.google.com/macros/s/AKfycbwZAgwzi9Hjviw1bhe519wS8xzw1JGVP5r4JnWuCk59Cns7YKwm1lZnXV5kRGONdkk4/exec',
        colors: ['#22e4ff', '#6a2cff'], tag: 'hot', openMode: 'hub' },
      { id: 'mole', title: '성모 두더지잡기', emoji: '🔨', category: '순발력',
        desc: '쏙쏙 튀어나오는 두더지를 빠르게 잡아요!',
        url: 'https://script.google.com/a/macros/smwelfare.or.kr/s/AKfycbxSexYaMFoccJHZDNscyKPFwCvOw3gY4TZsRkVbN3XP2qBWZ0DSG7K7dvgk5sBi6eedoQ/exec',
        colors: ['#c98a4b', '#6b3f1d'], tag: 'new', openMode: 'hub' },
      { id: 'soccer', title: '성모 Soccer', emoji: '⚽', category: '스포츠',
        desc: '공을 차서 골대에 슛! 골~인!',
        url: 'https://script.google.com/a/macros/smwelfare.or.kr/s/AKfycbxY7wHPFXhx7YygFnknn3PY0D6F_gv_ee8E2sjiRm65YC-yTo_ety_NtLKXS-ASZqLp/exec',
        colors: ['#3dffa2', '#0f8a4f'], tag: 'new', openMode: 'hub' },
      { id: 'fortress', title: '성모 포트리스', emoji: '💣', category: '슈팅',
        desc: '각도와 힘을 조절해서 포탄을 날려요!', url: '',
        colors: ['#ff8a3d', '#b3261e'], tag: '', openMode: 'hub' },
      { id: 'kart', title: '카트라이더', emoji: '🏎️', category: '레이싱',
        desc: '부릉부릉~ 트랙을 달려 1등으로 들어와요!', url: '',
        colors: ['#ffe14d', '#ff3ea5'], tag: '', openMode: 'hub' },
      { id: 'cat', title: '고양이 키우기', emoji: '🐱', category: '키우기',
        desc: '밥 주고, 놀아주고, 쓰다듬어서 고양이를 키워요.', url: '',
        colors: ['#ffd36e', '#ff8a3d'], tag: '', openMode: 'hub' },
      { id: 'dressup', title: '옷갈아입히기', emoji: '👗', category: '꾸미기',
        desc: '예쁜 옷과 액세서리로 나만의 스타일을 만들어요.', url: '',
        colors: ['#ff8ad8', '#ff3ea5'], tag: '', openMode: 'hub' }
    ];

    var IS_GAS = !!(window.google && google.script && google.script.run);

    /* 게임 데이터 정리: 빈 칸 채우기 + url 없으면 준비 중 */
    function normalizeGames(list) {
      return (list || []).map(function (g, i) {
        var hex = /^#[0-9a-fA-F]{6}$/;
        var c = g.colors || [];
        return {
          id: String(g.id || ('game' + i)),
          title: String(g.title || '이름 없는 게임'),
          emoji: String(g.emoji || '🎮'),
          category: String(g.category || '기타'),
          desc: String(g.desc || ''),
          url: /^https:\/\//.test(g.url || '') ? String(g.url) : '',
          colors: [hex.test(c[0]) ? c[0] : '#9b5cff', hex.test(c[1]) ? c[1] : '#ff3ea5'],
          tag: g.tag === 'new' || g.tag === 'hot' ? g.tag : '',
          openMode: g.openMode === 'top' ? 'top' : 'hub',
          soon: !/^https:\/\//.test(g.url || '')
        };
      });
    }

    var CATEGORY_ICON = { '전체': '🎲', '퍼즐': '🧩', '순발력': '⚡', '스포츠': '🏅', '슈팅': '🎯', '레이싱': '🏁', '꾸미기': '🎀', '키우기': '🐾', '기타': '📦' };

    var state = {
      games: normalizeGames(DEFAULT_GAMES),
      isAdmin: false,
      category: '전체',
      view: 'home',
      query: '',
      favs: load('hub_favs', []),
      recent: load('hub_recent', []),
      coins: load('hub_coins', 0)
    };

    /* ---------- 저장소 (실패해도 동작하도록) ---------- */
    function load(key, fallback) {
      try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
      catch (e) { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    /* ---------- 유틸 ---------- */
    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function toast(msg) {
      var t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 1800);
    }
    function findGame(id) {
      for (var i = 0; i < state.games.length; i++) if (state.games[i].id === id) return state.games[i];
      return null;
    }
    function gradOf(g) {
      var c = g.colors || ['#9b5cff', '#ff3ea5'];
      return 'linear-gradient(135deg,' + c[0] + ',' + c[1] + ')';
    }

    /* ---------- 배경 별 ---------- */
    (function makeStars() {
      var box = $('stars'), html = '';
      for (var i = 0; i < 40; i++) {
        html += '<span style="left:' + (Math.random() * 100) + '%;top:' + (Math.random() * 100) +
          '%;animation-delay:' + (Math.random() * 3) + 's"></span>';
      }
      box.innerHTML = html;
    })();

    /* ---------- 배너 테트리스 아트 ---------- */
    (function makeTetrisArt() {
      var C = { c: '#22e4ff', y: '#ffe14d', p: '#ff3ea5', g: '#3dffa2', o: '#ff8a3d', v: '#9b5cff', '.': '' };
      var rows = [
        '..yy..',
        '..yy..',
        '......',
        'p....c',
        'pp..gc',
        'pvvggc',
        'ovvgoc',
        'ooovoo'
      ];
      var html = '';
      rows.forEach(function (r, ri) {
        for (var i = 0; i < r.length; i++) {
          var k = r[i];
          html += k === '.' ? '<i class="e"></i>'
            : '<i class="' + (ri < 2 ? 'falling' : '') + '" style="background:' + C[k] + '"></i>';
        }
      });
      $('tetrisArt').innerHTML = html;
    })();

    /* ---------- 렌더링 ---------- */
    function renderHeader() {
      $('coinCount').textContent = state.coins;
      var h = new Date().getHours();
      $('greeting').textContent = h < 12 ? '좋은 아침, 플레이어!' : h < 18 ? '안녕, 플레이어!' : '좋은 저녁, 플레이어!';
    }

    function renderTabs() {
      var cats = ['전체'];
      state.games.forEach(function (g) { if (cats.indexOf(g.category) < 0) cats.push(g.category); });
      $('tabs').innerHTML = cats.map(function (c) {
        return '<button class="tab' + (c === state.category ? ' active' : '') + '" data-cat="' + esc(c) + '">' +
          (CATEGORY_ICON[c] || '🎮') + ' ' + esc(c) + '</button>';
      }).join('');
    }

    function renderRecent() {
      var items = state.recent.map(findGame).filter(Boolean);
      if (!items.length) {
        $('recentList').innerHTML = '<div class="empty-recent">아직 플레이한 게임이 없어요. 아래에서 골라보세요! 👇</div>';
        return;
      }
      $('recentList').innerHTML = items.map(function (g) {
        return '<div class="recent-item" data-play="' + esc(g.id) + '">' +
          '<div class="mini" style="background:' + gradOf(g) + '">' + esc(g.emoji) + '</div>' +
          '<div><b>' + esc(g.title) + '</b><span>' + esc(g.category) + '</span></div></div>';
      }).join('');
    }

    function visibleGames() {
      var q = state.query.trim().toLowerCase();
      return state.games.filter(function (g) {
        if (state.view === 'fav' && state.favs.indexOf(g.id) < 0) return false;
        if (state.view === 'new' && g.tag !== 'new') return false;
        if (state.category !== '전체' && g.category !== state.category) return false;
        if (q && (g.title + g.desc + g.category).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
    }

    function renderGrid() {
      var list = visibleGames();
      var titles = { home: '🎲 전체 게임', fav: '❤️ 즐겨찾기', new: '✨ 새로 나온 게임' };
      $('listTitle').textContent = titles[state.view];
      $('gameCount').textContent = list.filter(function (g) { return !g.soon; }).length + '개';

      if (!list.length) {
        var msg = state.view === 'fav' ? '하트 ♡ 를 눌러 좋아하는 게임을 모아보세요!' : '찾는 게임이 없어요 😢';
        $('gameGrid').innerHTML = '<div class="no-result">' + msg + '</div>';
        return;
      }

      $('gameGrid').innerHTML = list.map(function (g, i) {
        var c = g.colors || ['#9b5cff', '#ff3ea5'];
        var isFav = state.favs.indexOf(g.id) >= 0;
        var tag = g.soon ? '<span class="tag">🔧 준비 중</span>'
          : g.tag === 'new' ? '<span class="tag new">NEW</span>'
          : g.tag === 'hot' ? '<span class="tag hot">🔥 인기</span>' : '';
        return '<article class="card' + (g.soon ? ' soon' : '') + '"' + (g.soon ? '' : ' data-play="' + esc(g.id) + '"') +
          ' style="--grad:' + gradOf(g) + ';--accent:' + c[0] + ';--glow:' + c[0] + '66;animation-delay:' + (i * 0.05) + 's">' +
          '<div class="thumb">' + tag +
            (g.soon ? '' : '<button class="fav' + (isFav ? ' on' : '') + '" data-fav="' + esc(g.id) + '">' + (isFav ? '♥' : '♡') + '</button>') +
            '<span class="emoji">' + esc(g.emoji) + '</span></div>' +
          '<div class="card-body"><h4>' + esc(g.title) + '</h4><p>' + esc(g.desc) + '</p>' +
            '<div class="card-foot"><span class="cat-label">' + (CATEGORY_ICON[g.category] || '🎮') + ' ' + esc(g.category) + '</span>' +
            '<button class="play-mini">' + (g.soon ? '🔒' : '▶') + '</button></div></div>' +
        '</article>';
      }).join('');
    }

    function renderAll() { renderHeader(); renderTabs(); renderRecent(); renderGrid(); }

    /* ---------- 게임 실행 ---------- */
    function playGame(id) {
      var g = findGame(id);
      if (!g || g.soon) return;

      state.recent = [id].concat(state.recent.filter(function (x) { return x !== id; })).slice(0, 6);
      state.coins += 10;
      save('hub_recent', state.recent); save('hub_coins', state.coins);

      $('launchEmoji').textContent = g.emoji;
      $('launchTitle').textContent = g.title;
      var modal = $('launch');
      modal.classList.remove('show'); void modal.offsetWidth; modal.classList.add('show');

      setTimeout(function () {
        modal.classList.remove('show');
        renderAll();
        if (g.url) {
          if (g.openMode === 'top') window.open(g.url, '_top');
          else openInHub(g.url);
        } else {
          toast('🔗 "' + g.title + '" 링크가 아직 등록되지 않았어요 (+10 🪙)');
        }
      }, 1300);
    }

    /* ---------- 허브 안에서 게임 띄우기 ----------
       각 게임의 Code.gs doGet() 에
       .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL) 이 있어야 합니다. */
    // 게임마다 iframe 을 새로 만들고, 닫을 때 통째로 지웁니다.
    // (src 만 바꾸면 게임 안의 페이지 기록이 뒤로가기 기록에 쌓여서
    //  '허브로' 를 두 번 눌러야 돌아오는 문제가 생깁니다)
    function openInHub(url) {
      closeGame();
      state.playingUrl = url;
      var f = document.createElement('iframe');
      f.id = 'gameFrame';
      f.setAttribute('allow', 'fullscreen; autoplay');
      f.setAttribute('allowfullscreen', '');
      f.src = url;
      $('playerFrame').appendChild(f);
      $('playerFrame').classList.add('show');
      history.pushState({ hubGame: true }, '');
      syncFs();
    }
    function closeGame() {
      var f = $('gameFrame');
      if (f) f.parentNode.removeChild(f);
      $('playerFrame').classList.remove('show');
      syncFs();
    }
    // 허브로 버튼: 기록과 상관없이 바로 닫기
    $('homeBtn').addEventListener('click', function () {
      closeGame();
      // 게임을 열 때 넣어 둔 기록 1칸 정리 (화면은 이미 닫혀 있음)
      if (history.state && history.state.hubGame) history.back();
    });
    // 허브 안에서 화면이 안 뜨는 게임은 새 화면으로 열기
    $('popBtn').addEventListener('click', function () { window.open(state.playingUrl, '_top'); });
    // 안드로이드 뒤로가기 버튼 → 허브로 돌아오기
    window.addEventListener('popstate', closeGame);

    /* ---------- 이벤트 ---------- */
    document.addEventListener('click', function (e) {
      var fav = e.target.closest('[data-fav]');
      if (fav) {
        e.stopPropagation();
        var id = fav.getAttribute('data-fav');
        var idx = state.favs.indexOf(id);
        if (idx >= 0) { state.favs.splice(idx, 1); toast('즐겨찾기에서 뺐어요'); }
        else { state.favs.push(id); toast('❤️ 즐겨찾기에 추가!'); }
        save('hub_favs', state.favs);
        renderGrid();
        return;
      }
      var play = e.target.closest('[data-play]');
      if (play) { playGame(play.getAttribute('data-play')); return; }

      var tab = e.target.closest('[data-cat]');
      if (tab) { state.category = tab.getAttribute('data-cat'); renderTabs(); renderGrid(); return; }

      var nav = e.target.closest('[data-view]');
      if (nav) {
        state.view = nav.getAttribute('data-view');
        document.querySelectorAll('.nav-btn').forEach(function (b) { b.classList.toggle('active', b === nav); });
        renderGrid();
        $('listTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });

    $('searchInput').addEventListener('input', function (e) { state.query = e.target.value; renderGrid(); });
    $('heroPlay').addEventListener('click', function () { playGame(state.heroId); });

    /* ---------- 전체화면 + 전체화면 고정 ----------
       브라우저 규칙상 웹페이지는 '화면을 터치했을 때'만 전체화면이 될 수 있어요.
       (뒤로가기·앱 전환·알림창 등으로 풀리는 것도 막을 수 없어요)
       그래서 ⛶ 를 켜 두면 '고정' 상태가 되어, 전체화면이 풀린 뒤
       다음 터치 한 번에 자동으로 다시 전체화면이 됩니다.
       ⛶ 를 다시 누르면 전체화면과 고정이 함께 꺼집니다. (태블릿마다 따로 기억) */
    var IS_INSTALLED_APP = !!(window.matchMedia &&
      matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches);
    var fs = {
      lock: !IS_INSTALLED_APP && load('hub_fs_lock', true),
      failed: false   // 이 환경에서 전체화면이 안 되면 자동 시도를 멈춤
    };

    function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }

    function enterFullscreen(explicit) {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      function fail() {
        fs.failed = true;
        syncFs();
        if (explicit) toast('전체화면을 쓸 수 없는 환경이에요');
      }
      if (!req) { fail(); return; }
      try {
        var p = req.call(el, { navigationUI: 'hide' });
        if (p && p.then) p.then(function () { fs.failed = false; }, fail);
      } catch (e) { fail(); }
    }

    function exitFullscreen() {
      var ex = document.exitFullscreen || document.webkitExitFullscreen;
      if (ex && isFullscreen()) ex.call(document);
    }

    // ⛶ 버튼 (헤더, 게임 화면 공통)
    function onFsButton() {
      if (isFullscreen()) {
        fs.lock = false;
        exitFullscreen();
        toast('전체화면 고정을 껐어요');
      } else {
        fs.lock = true;
        fs.failed = false;
        enterFullscreen(true);
      }
      save('hub_fs_lock', fs.lock);
      syncFs();
    }

    // 고정 상태에서 전체화면이 풀려 있으면, 어디를 누르든 그 터치로 다시 전체화면
    document.addEventListener('click', function (e) {
      if (!e.isTrusted || !fs.lock || fs.failed || isFullscreen()) return;
      if (e.target.closest && e.target.closest('[data-fs]')) return; // ⛶ 버튼은 자기가 처리
      enterFullscreen(false);
    }, true);

    function syncFs() {
      var on = isFullscreen();
      var gameOpen = $('playerFrame').classList.contains('show');
      $('fsBtn').classList.toggle('on', on);
      $('fsBtn').title = on ? '전체화면 끄기' : '전체화면';
      $('fsBtn2').textContent = on ? '⛶' : '⛶ 전체화면';
      $('fsBtn2').title = on ? '전체화면 끄기' : '전체화면';
      $('fsBtn2').classList.toggle('attn', !on && !IS_INSTALLED_APP);
      // 게임 중에는 터치가 게임으로 가버리므로, 게임 위에 '한 번 누르기' 막을 띄움
      $('fsCatcher').classList.toggle('show', gameOpen && fs.lock && !fs.failed && !on && !IS_INSTALLED_APP);
    }

    $('fsBtn').addEventListener('click', onFsButton);
    $('fsBtn2').addEventListener('click', onFsButton);
    document.addEventListener('fullscreenchange', syncFs);
    document.addEventListener('webkitfullscreenchange', syncFs);

    // 앱(PWA)으로 설치해 이미 전체화면이면 버튼 숨기기
    if (IS_INSTALLED_APP) {
      $('fsBtn').style.display = 'none';
      $('fsBtn2').style.display = 'none';
    }
    syncFs();

    function setHero() {
      var playable = state.games.filter(function (g) { return !g.soon; });
      var hero = playable.filter(function (g) { return g.tag === 'hot'; })[0] || playable[0];
      if (!hero) return;
      state.heroId = hero.id;
      $('heroTitle').textContent = hero.title;
      $('heroDesc').textContent = hero.desc;
      var isTetris = hero.title.indexOf('테트리스') >= 0;
      $('tetrisArt').style.display = isTetris ? '' : 'none';
      $('heroEmoji').style.display = isTetris ? 'none' : '';
      $('heroEmoji').textContent = hero.emoji;
    }

    /* ---------- 관리자: 게임 링크 넣기/수정 ----------
       서버(Code.gs)에서 관리자 계정인지 확인한 뒤에만 저장됩니다. */
    function openAdmin() {
      state.draft = JSON.parse(JSON.stringify(state.games));
      renderAdmin();
      $('admin').classList.add('show');
    }
    function closeAdmin() { $('admin').classList.remove('show'); }

    function renderAdmin() {
      var cats = [];
      state.draft.forEach(function (g) { if (g.category && cats.indexOf(g.category) < 0) cats.push(g.category); });
      Object.keys(CATEGORY_ICON).forEach(function (c) { if (c !== '전체' && cats.indexOf(c) < 0) cats.push(c); });
      $('catList').innerHTML = cats.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');

      $('adminList').innerHTML = state.draft.map(function (g, i) {
        function opt(v, label, cur) { return '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + label + '</option>'; }
        return '<div class="arow" data-i="' + i + '">' +
          '<div class="arow-top">' +
            '<input class="a-emoji" value="' + esc(g.emoji) + '" maxlength="4">' +
            '<input class="a-title" value="' + esc(g.title) + '" placeholder="게임 이름">' +
            '<div class="arow-btns">' +
              '<button class="abtn" data-move="-1"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
              '<button class="abtn" data-move="1"' + (i === state.draft.length - 1 ? ' disabled' : '') + '>↓</button>' +
              '<button class="abtn danger" data-del>🗑</button>' +
            '</div>' +
          '</div>' +
          '<label>게임 주소 (앱스 스크립트 …/exec, 비워두면 “준비 중”)' +
            '<input class="a-url" value="' + esc(g.url) + '" placeholder="https://script.google.com/macros/s/.../exec" inputmode="url"></label>' +
          '<div class="arow-grid">' +
            '<label>분류<input class="a-cat" value="' + esc(g.category) + '" list="catList"></label>' +
            '<label>표시<select class="a-tag">' + opt('', '없음', g.tag) + opt('new', '✨ NEW', g.tag) + opt('hot', '🔥 인기 (배너)', g.tag) + '</select></label>' +
            '<label>열기 방식<select class="a-mode">' + opt('hub', '허브 안에서', g.openMode) + opt('top', '새 화면으로', g.openMode) + '</select></label>' +
            '<label>카드 색<span class="colors">' +
              '<input type="color" class="a-c1" value="' + esc(g.colors[0]) + '">' +
              '<input type="color" class="a-c2" value="' + esc(g.colors[1]) + '"></span></label>' +
          '</div>' +
          '<label>설명<input class="a-desc" value="' + esc(g.desc) + '"></label>' +
        '</div>';
      }).join('');
    }

    // 입력칸 내용을 draft 에 반영
    function collectDraft() {
      var rows = document.querySelectorAll('#adminList .arow');
      rows.forEach(function (row) {
        var g = state.draft[+row.getAttribute('data-i')];
        function v(cls) { return row.querySelector(cls).value.trim(); }
        g.emoji = v('.a-emoji') || '🎮';
        g.title = v('.a-title');
        g.url = v('.a-url');
        g.category = v('.a-cat') || '기타';
        g.tag = v('.a-tag');
        g.openMode = v('.a-mode');
        g.colors = [v('.a-c1'), v('.a-c2')];
        g.desc = v('.a-desc');
      });
    }

    function validateDraft() {
      var ok = true;
      document.querySelectorAll('#adminList .arow').forEach(function (row) {
        var g = state.draft[+row.getAttribute('data-i')];
        var badUrl = g.url && !/^https:\/\//.test(g.url);
        var badTitle = !g.title;
        row.querySelector('.a-url').classList.toggle('bad', !!badUrl);
        row.querySelector('.a-title').classList.toggle('bad', badTitle);
        if (badUrl || badTitle) ok = false;
      });
      return ok;
    }

    $('adminList').addEventListener('click', function (e) {
      var row = e.target.closest('.arow');
      if (!row) return;
      var i = +row.getAttribute('data-i');
      var mv = e.target.closest('[data-move]');
      var del = e.target.closest('[data-del]');
      if (!mv && !del) return;
      collectDraft();
      if (mv) {
        var j = i + (+mv.getAttribute('data-move'));
        if (j < 0 || j >= state.draft.length) return;
        var t = state.draft[i]; state.draft[i] = state.draft[j]; state.draft[j] = t;
      } else {
        if (!confirm('"' + (state.draft[i].title || '이 게임') + '" 을(를) 목록에서 지울까요?')) return;
        state.draft.splice(i, 1);
      }
      renderAdmin();
    });

    $('adminAdd').addEventListener('click', function () {
      collectDraft();
      state.draft.push({ id: 'g' + new Date().getTime(), title: '', emoji: '🎮', category: '기타', desc: '',
        url: '', colors: ['#9b5cff', '#ff3ea5'], tag: 'new', openMode: 'hub' });
      renderAdmin();
      var rows = document.querySelectorAll('#adminList .arow');
      var last = rows[rows.length - 1];
      last.scrollIntoView({ behavior: 'smooth', block: 'center' });
      last.querySelector('.a-title').focus();
    });

    $('adminSave').addEventListener('click', function () {
      collectDraft();
      if (!validateDraft()) { toast('빨간 칸을 확인해 주세요 (주소는 https:// 로 시작)'); return; }
      var btn = $('adminSave');
      if (!IS_GAS) {
        applyGames(state.draft);
        closeAdmin();
        toast('미리보기라서 이 화면에만 적용됐어요');
        return;
      }
      btn.disabled = true; btn.textContent = '저장 중...';
      google.script.run
        .withSuccessHandler(function (saved) {
          btn.disabled = false; btn.textContent = '💾 저장';
          applyGames(saved);
          closeAdmin();
          toast('✅ 저장했어요! 모든 태블릿에 적용돼요');
        })
        .withFailureHandler(function (err) {
          btn.disabled = false; btn.textContent = '💾 저장';
          toast('저장 실패: ' + (err && err.message ? err.message : err));
        })
        .saveGames(state.draft);
    });

    $('adminBtn').addEventListener('click', openAdmin);
    $('adminClose').addEventListener('click', closeAdmin);
    $('adminCancel').addEventListener('click', closeAdmin);

    function applyGames(list) {
      var games = normalizeGames(list);
      if (!games.length) return;
      state.games = games;
      if (state.category !== '전체' && !games.some(function (g) { return g.category === state.category; })) state.category = '전체';
      setHero();
      renderAll();
    }

    function showAdminButton(email) {
      state.isAdmin = true;
      $('adminBtn').style.display = '';
      $('adminWho').textContent = email || '';
    }

    /* ---------- 시작 ---------- */
    setHero();
    renderAll();

    // 홈 화면 앱(PWA)용 서비스워커 등록 — GitHub Pages(https)에서만 동작
    if ('serviceWorker' in navigator && location.protocol === 'https:' && !IS_GAS) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }

    if (IS_GAS) {
      // 앱스 스크립트: 저장된 게임 목록 + 관리자 여부 불러오기
      google.script.run
        .withSuccessHandler(function (data) {
          if (!data) return;
          if (data.games && data.games.length) applyGames(data.games);
          if (data.isAdmin) showAdminButton(data.email);
        })
        .getHubData();
    } else if (location.hash === '#admin') {
      // 미리보기 전용: 주소 끝에 #admin 을 붙이면 관리 화면을 볼 수 있어요 (저장은 안 됨)
      showAdminButton('미리보기 모드');
    }
  </script>
</body>
</html>
